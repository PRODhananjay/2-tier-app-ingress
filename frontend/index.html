<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Two-Tier App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #6366f1;
      --accent-2: #8b5cf6;
      --pink: #ec4899;
      --ok: #22c55e;
      --err: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b1020;
      overflow-x: hidden;
      perspective: 1200px;
    }

    /* animated glow blobs */
    body::before, body::after {
      content: "";
      position: fixed;
      width: 520px; height: 520px;
      border-radius: 50%;
      filter: blur(110px);
      opacity: .5;
      z-index: -2;
      animation: float 14s ease-in-out infinite alternate;
    }
    body::before { background: #4f46e5; top: -160px; left: -120px; }
    body::after  { background: #db2777; bottom: -180px; right: -120px; animation-delay: -7s; }
    @keyframes float { to { transform: translate(80px, 60px) scale(1.2); } }

    /* subtle moving grid */
    .grid {
      position: fixed; inset: 0; z-index: -1;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at center, #000 20%, transparent 75%);
      animation: grid 20s linear infinite;
    }
    @keyframes grid { to { background-position: 48px 48px; } }

    /* floating particles */
    .particles { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .particles i {
      position: absolute; bottom: -20px;
      width: var(--s); height: var(--s);
      border-radius: 50%;
      background: rgba(199, 210, 254, .7);
      box-shadow: 0 0 12px rgba(165, 180, 252, .8);
      animation: rise-up var(--d) linear infinite;
      animation-delay: var(--delay);
      left: var(--x);
      opacity: 0;
    }
    @keyframes rise-up {
      10% { opacity: 1; }
      90% { opacity: .8; }
      100% { transform: translateY(-110vh) translateX(var(--drift)); opacity: 0; }
    }

    /* card with spinning gradient border */
    .card {
      position: relative;
      width: 100%; max-width: 460px;
      padding: 44px 36px 36px;
      text-align: center;
      border-radius: 24px;
      background: rgba(15, 20, 40, .65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, .5);
      transform-style: preserve-3d;
      transition: transform .15s ease-out;
      animation: enter .9s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes enter { from { opacity: 0; transform: translateY(40px) scale(.94); } }

    @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    .card::before {
      content: "";
      position: absolute; inset: -1.5px; z-index: -1;
      border-radius: inherit;
      background: conic-gradient(from var(--angle), transparent 0 55%, var(--accent), var(--pink), var(--accent-2), transparent 95%);
      animation: spin 5s linear infinite;
    }
    .card::after {
      content: "";
      position: absolute; inset: 0; z-index: -1;
      border-radius: inherit;
      background: rgb(13, 18, 36);
    }
    @keyframes spin { to { --angle: 360deg; } }

    /* staggered children */
    .card > * { animation: pop .7s cubic-bezier(.2, .8, .2, 1) both; }
    .card > :nth-child(1) { animation-delay: .25s; }
    .card > :nth-child(2) { animation-delay: .35s; }
    .card > :nth-child(3) { animation-delay: .45s; }
    .card > :nth-child(4) { animation-delay: .55s; }
    .card > :nth-child(5) { animation-delay: .65s; }
    .card > :nth-child(6) { animation-delay: .75s; }
    @keyframes pop { from { opacity: 0; transform: translateY(18px); } }

    .icon {
      position: relative;
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      display: grid; place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 30px rgba(99, 102, 241, .5);
      animation: pop .7s .25s cubic-bezier(.2, .8, .2, 1) both, bob 3.5s 1s ease-in-out infinite;
    }
    .icon::before, .icon::after {
      content: ""; position: absolute; inset: 0;
      border-radius: inherit;
      border: 2px solid var(--accent);
      animation: ring 2.4s ease-out infinite;
    }
    .icon::after { animation-delay: 1.2s; }
    @keyframes ring { to { transform: scale(1.9); opacity: 0; } }
    @keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
    .icon svg { width: 32px; height: 32px; stroke: #fff; }

    h1 {
      margin: 0 0 10px;
      font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em;
      background: linear-gradient(90deg, #fff, #a5b4fc, #f0abfc, #fff);
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      animation: pop .7s .35s both, shimmer 5s 1s linear infinite;
    }
    @keyframes shimmer { to { background-position: -250% 0; } }

    p { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }

    /* tiers with traveling data packet */
    .tiers {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 28px;
      font-size: .8rem; font-weight: 600;
    }
    .tier {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .12);
      transition: box-shadow .3s, border-color .3s;
    }
    .tier.glow { border-color: var(--ok); box-shadow: 0 0 18px rgba(34, 197, 94, .55); }
    .tier.glow-err { border-color: var(--err); box-shadow: 0 0 18px rgba(239, 68, 68, .55); }
    .link {
      position: relative;
      width: 60px; height: 2px; border-radius: 2px;
      background: rgba(255, 255, 255, .2);
      transition: background .3s, box-shadow .3s;
    }
    .link::after {
      content: ""; position: absolute; top: -3px; left: 0;
      width: 8px; height: 8px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 10px #fff;
      opacity: 0;
    }
    .link.busy::after { opacity: 1; animation: packet .9s ease-in-out infinite alternate; }
    @keyframes packet { to { left: calc(100% - 8px); } }
    .link.ok  { background: var(--ok);  box-shadow: 0 0 12px var(--ok); }
    .link.err { background: var(--err); box-shadow: 0 0 12px var(--err); }

    /* button */
    button {
      position: relative; overflow: hidden;
      font: inherit; font-weight: 600;
      color: #fff;
      padding: 14px 30px;
      border: 0; border-radius: 14px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--pink));
      background-size: 200% 200%;
      box-shadow: 0 10px 25px rgba(99, 102, 241, .45);
      transition: transform .15s, box-shadow .15s;
      animation: pop .7s .55s both, pulse-btn 2.6s 1.4s ease-in-out infinite, grad 6s ease infinite;
    }
    @keyframes grad { 50% { background-position: 100% 50%; } }
    @keyframes pulse-btn {
      50% { box-shadow: 0 10px 25px rgba(99, 102, 241, .45), 0 0 0 10px rgba(99, 102, 241, 0); }
      0%  { box-shadow: 0 10px 25px rgba(99, 102, 241, .45), 0 0 0 0 rgba(99, 102, 241, .5); }
    }
    button::before { /* shine sweep */
      content: ""; position: absolute; top: 0; left: -75%;
      width: 50%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,.4), transparent);
      transform: skewX(-20deg);
    }
    button:hover::before { animation: sweep .7s; }
    @keyframes sweep { to { left: 130%; } }
    button:hover  { transform: translateY(-3px) scale(1.04); box-shadow: 0 16px 34px rgba(139, 92, 246, .65); }
    button:active { transform: translateY(0) scale(.97); }
    button:disabled { opacity: .75; cursor: progress; transform: none; }
    .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.5);
      transform: scale(0);
      animation: ripple .6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }

    /* result */
    #result {
      margin-top: 26px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: .92rem;
      color: var(--muted);
      background: rgba(0, 0, 0, .3);
      border: 1px solid rgba(255, 255, 255, .08);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: border-color .3s, color .3s;
    }
    #result.ok  { color: #bbf7d0; border-color: rgba(34, 197, 94, .5); animation: bounce .6s; }
    #result.err { color: #fecaca; border-color: rgba(239, 68, 68, .5); animation: shake .5s; }
    @keyframes bounce { 30% { transform: scale(1.06); } 60% { transform: scale(.98); } }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
    #result.busy .dot { animation: pulse-dot .6s infinite alternate; }
    @keyframes pulse-dot { to { opacity: .2; transform: scale(.6); } }
    #text.swap { animation: swap .4s; }
    @keyframes swap { from { opacity: 0; transform: translateY(8px); } }

    /* confetti */
    .confetti {
      position: fixed; top: 0; width: 10px; height: 14px;
      pointer-events: none; z-index: 10;
      animation: fall var(--t) cubic-bezier(.3, .6, .6, 1) forwards;
    }
    @keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(var(--r)); opacity: .8; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="particles" id="particles"></div>

  <div class="card" id="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="7" rx="2"/>
        <rect x="3" y="14" width="18" height="7" rx="2"/>
        <path d="M7 6.5h.01M7 17.5h.01"/>
      </svg>
    </div>
    <h1>My Two-Tier Application</h1>
    <p>Frontend connected to a Python backend.</p>

    <div class="tiers">
      <span class="tier" id="t1">Frontend</span>
      <span class="link" id="link"></span>
      <span class="tier" id="t2">Backend</span>
    </div>

    <button id="btn" onclick="getMessage(event)">Test Backend</button>
    <div id="result"><span class="dot"></span><span id="text">Click to test the connection.</span></div>
  </div>

  <script>
    // floating particles
    const pWrap = document.getElementById("particles");
    for (let i = 0; i < 28; i++) {
      const p = document.createElement("i");
      p.style.cssText =
        `--x:${Math.random() * 100}%;--s:${2 + Math.random() * 4}px;` +
        `--d:${8 + Math.random() * 12}s;--delay:${-Math.random() * 20}s;` +
        `--drift:${(Math.random() - .5) * 120}px`;
      pWrap.appendChild(p);
    }

    // 3D tilt following the mouse
    const card = document.getElementById("card");
    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / innerWidth - .5) * 2;
      const y = (e.clientY / innerHeight - .5) * 2;
      card.style.transform = `rotateY(${x * 6}deg) rotateX(${-y * 6}deg)`;
    });
    document.addEventListener("mouseleave", () => card.style.transform = "");

    function ripple(e) {
      const btn = e.currentTarget;
      const r = btn.getBoundingClientRect();
      const d = Math.max(r.width, r.height);
      const s = document.createElement("span");
      s.className = "ripple";
      s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
      btn.appendChild(s);
      setTimeout(() => s.remove(), 600);
    }

    function confetti() {
      const colors = ["#6366f1", "#8b5cf6", "#ec4899", "#22c55e", "#facc15", "#38bdf8"];
      for (let i = 0; i < 60; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.cssText =
          `left:${Math.random() * 100}%;background:${colors[i % colors.length]};` +
          `--dx:${(Math.random() - .5) * 300}px;--r:${Math.random() * 900}deg;--t:${1.8 + Math.random() * 1.5}s;` +
          `border-radius:${Math.random() > .5 ? "50%" : "2px"}`;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3500);
      }
    }

    async function getMessage(e) {
      const result = document.getElementById("result");
      const text = document.getElementById("text");
      const link = document.getElementById("link");
      const t1 = document.getElementById("t1");
      const t2 = document.getElementById("t2");
      const btn = document.getElementById("btn");

      ripple(e);

      const setState = (cls, msg) => {
        result.className = "";
        void result.offsetWidth; // restart animation
        result.className = cls;
        link.className = "link " + cls;
        t1.className = t2.className = "tier" + (cls === "ok" ? " glow" : cls === "err" ? " glow-err" : "");
        text.textContent = msg;
        text.classList.remove("swap");
        void text.offsetWidth;
        text.classList.add("swap");
      };

      btn.disabled = true;
      setState("busy", "Connecting...");

      try {
        const response = await fetch("http://127.0.0.1:5000/api");
        if (!response.ok) throw new Error("Backend request failed");

        const data = await response.json();
        setState("ok", data.message + " | " + data.status);
        confetti();
      } catch (error) {
        setState("err", "Backend connection failed.");
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
